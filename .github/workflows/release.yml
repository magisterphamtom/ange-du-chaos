name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mettre à jour version et téléchargement dans system.json
        run: |
          V="${GITHUB_REF_NAME#v}"
          jq --arg v "$V" --arg d "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/ange-du-chaos.zip" \
            '.version = $v | .download = $d' system.json > system.tmp && mv system.tmp system.json
      - name: Construire le zip (fichiers à la racine)
        run: zip -r ange-du-chaos.zip . -x '.git/*' '.github/*' 'node_modules/*' '*.zip'
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            system.json
            ange-du-chaos.zip
